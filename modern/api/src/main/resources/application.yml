spring:
  application:
    name: item-bank-api
  datasource:
    url: jdbc:mariadb://localhost:3306/itembank
    username: app
    password: app-pass
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: itembank-pool
      # 커넥션 풀 — 운영 값과 같게 맞춘다.
      # 풀이 작고 대기 시간이 짧아, 트랜잭션을 오래 쥐는 코드가 있으면 금방 고갈된다.
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
  # 문항 검색 이관: 레거시(Apache)처럼 긴 요청 줄에 414 를 주려면 요청이 Tomcat 을 통과해야 한다
  # (Tomcat 기본 8KB 를 넘으면 400). 414 판정은 config/RequestLineLimitInterceptor 가 한다.
  max-http-request-header-size: 32KB

logging:
  level:
    root: INFO
    com.example: INFO
